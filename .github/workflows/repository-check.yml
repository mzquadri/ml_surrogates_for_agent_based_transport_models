name: Repository Check

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r dashboard-requirements.txt pytest ruff pyright
      - run: python scripts/check_repository.py
      - run: ruff check thesis_dashboard scripts/analysis scripts/check_repository.py tests
      - run: pyright
      - run: python -m pytest -p no:cacheprovider tests
