name: Repository Check

# Everything here runs from a plain checkout with no release downloads, so the
# whole workflow finishes in minutes. The two AUROC checks that need the 209 MB
# ablation CSV report SKIP rather than failing; that is deliberate, and
# verify_headline_results.py still exits non-zero if any runnable number drifts.

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install analysis dependencies
        run: pip install numpy scipy pandas scikit-learn matplotlib pytest ruff

      - name: Repository structure
        run: python scripts/check_repository.py

      - name: Lint the verification tooling
        run: ruff check .

      - name: Documentation links and SVG validity
        run: python scripts/check_docs.py

      - name: Web assets parse and match their schema
        run: python scripts/check_web_assets.py

      - name: Test suite
        run: python -m pytest -q

      - name: Headline numbers still match their artifacts
        run: python scripts/verify_headline_results.py
