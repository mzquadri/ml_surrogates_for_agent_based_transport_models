<text class="sub" x="328" y="350" text-anchor="middle">31,635 nodes</text>
<text class="sub" x="328" y="366" text-anchor="middle">59,851 edges</text>
<line x1="381.2" y1="369.5" x2="394.5" y2="377.1" stroke="#94a3b8" stroke-width="2"/>
