<text class="lbl" x="858" y="467" text-anchor="middle">Decision</text>
<text class="sub" x="858" y="484" text-anchor="middle">-41.2% MAE</text>
<text class="sub" x="858" y="500" text-anchor="middle">AUROC 0.7585</text>
<text class="cap" x="34" y="602">The surrogate replaces the simulator for the forward question only. Everything from MC Dropout rightwards is post-hoc: the trained</text>
<text class="cap" x="34" y="620">weights are loaded, frozen, and never updated, which is what makes the uncertainty layer cheap enough to be practical.</text>
<text class="cap" x="34" y="638">Calibration figures follow the graph20_80_v1 protocol; see docs/CORRIGENDUM.md C3.</text>
