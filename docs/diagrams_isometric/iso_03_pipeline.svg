<text class="lbl" x="798" y="604" text-anchor="middle">Decision</text>
<text class="sub" x="798" y="621" text-anchor="middle">-41.2% MAE</text>
<text class="sub" x="798" y="637" text-anchor="middle">AUROC 0.7585</text>
<text class="cap" x="34" y="562">The surrogate replaces the simulator for the forward question only. Everything from MC Dropout rightwards is post-hoc: the trained</text>
<text class="cap" x="34" y="580">weights are loaded, frozen, and never updated, which is what makes the uncertainty layer cheap enough to be practical.</text>
<text class="cap" x="34" y="598">Calibration figures follow the graph20_80_v1 protocol; see docs/CORRIGENDUM.md C3.</text>
