<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <text x="500" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Calibration before and after sigma-scaling (T* = 2.887)</text>

  <!-- Panel 1: ECE -->
  <text x="200" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Expected calibration error</text>
  <line x1="80" y1="330" x2="320" y2="330" stroke="#9ca3af"/>
  <rect x="115" y="81" width="60" height="249" rx="3" fill="#dc2626"/>
  <text x="145" y="73" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">0.356</text>
  <rect x="225" y="306" width="60" height="24" rx="3" fill="#0d9488"/>
  <text x="255" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#134e4a">0.034</text>
  <text x="145" y="350" text-anchor="middle" font-size="11" fill="#6b7280">before</text>
  <text x="255" y="350" text-anchor="middle" font-size="11" fill="#6b7280">after</text>
  <text x="200" y="378" text-anchor="middle" font-size="11" font-weight="600" fill="#134e4a">90.5% lower</text>

  <!-- Panel 2: 1-sigma coverage -->
  <text x="500" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">1-sigma coverage (target 68.3%)</text>
  <line x1="380" y1="330" x2="620" y2="330" stroke="#9ca3af"/>
  <line x1="380" y1="92" x2="620" y2="92" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="616" y="86" text-anchor="end" font-size="10" fill="#0f766e">ideal 68.3%</text>
  <rect x="415" y="216" width="60" height="114" rx="3" fill="#dc2626"/>
  <text x="445" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">32.7%</text>
  <rect x="525" y="93" width="60" height="237" rx="3" fill="#0d9488"/>
  <text x="555" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#134e4a">68.0%</text>
  <text x="445" y="350" text-anchor="middle" font-size="11" fill="#6b7280">before</text>
  <text x="555" y="350" text-anchor="middle" font-size="11" fill="#6b7280">after</text>

  <!-- Panel 3: k95 -->
  <text x="800" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">95% z-score (ideal 1.96)</text>
  <line x1="680" y1="330" x2="920" y2="330" stroke="#9ca3af"/>
  <line x1="680" y1="284" x2="920" y2="284" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="916" y="278" text-anchor="end" font-size="10" fill="#0f766e">ideal 1.96</text>
  <rect x="715" y="59" width="60" height="271" rx="3" fill="#dc2626"/>
  <text x="745" y="53" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">11.66</text>
  <rect x="825" y="236" width="60" height="94" rx="3" fill="#0d9488"/>
  <text x="855" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#134e4a">4.04</text>
  <text x="745" y="350" text-anchor="middle" font-size="11" fill="#6b7280">before</text>
  <text x="855" y="350" text-anchor="middle" font-size="11" fill="#6b7280">after</text>

  <text x="500" y="395" text-anchor="middle" font-size="11" fill="#6b7280">Raw MC Dropout intervals were far too narrow. A single fitted scaling factor repairs most of the miscalibration.</text>
</svg>
