<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Stage 1 -->
  <rect x="10" y="60" width="180" height="120" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="100" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">MATSim simulation</text>
  <text x="100" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">corpus</text>
  <text x="100" y="128" text-anchor="middle" font-size="11" fill="#4b5563">10,000 scenarios</text>
  <text x="100" y="143" text-anchor="middle" font-size="11" fill="#4b5563">Paris network</text>
  <text x="100" y="158" text-anchor="middle" font-size="11" fill="#4b5563">(Natterer et al. 2025)</text>

  <line x1="192" y1="120" x2="216" y2="120" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="218" y="60" width="180" height="120" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="308" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Fixed evaluation</text>
  <text x="308" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">subset</text>
  <text x="308" y="128" text-anchor="middle" font-size="11" fill="#4b5563">1,000 scenarios (10%)</text>
  <text x="308" y="143" text-anchor="middle" font-size="11" fill="#4b5563">31,635 road segments</text>
  <text x="308" y="158" text-anchor="middle" font-size="11" fill="#4b5563">held out from training</text>

  <line x1="400" y1="120" x2="424" y2="120" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="426" y="60" width="180" height="120" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="516" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Graph construction</text>
  <text x="516" y="112" text-anchor="middle" font-size="11" fill="#4b5563">one node per segment</text>
  <text x="516" y="127" text-anchor="middle" font-size="11" fill="#4b5563">traffic and network</text>
  <text x="516" y="142" text-anchor="middle" font-size="11" fill="#4b5563">attributes as features</text>

  <line x1="608" y1="120" x2="632" y2="120" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="634" y="60" width="180" height="120" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="724" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">PointNetTransfGAT</text>
  <text x="724" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">surrogate</text>
  <text x="724" y="128" text-anchor="middle" font-size="11" fill="#3b5bdb">graph neural network</text>
  <text x="724" y="143" text-anchor="middle" font-size="11" fill="#3b5bdb">replaces the simulator</text>

  <line x1="816" y1="120" x2="840" y2="120" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 5 -->
  <rect x="842" y="60" width="180" height="120" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="932" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Prediction and</text>
  <text x="932" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">uncertainty</text>
  <text x="932" y="128" text-anchor="middle" font-size="11" fill="#3b5bdb">speed change per link</text>
  <text x="932" y="143" text-anchor="middle" font-size="11" fill="#3b5bdb">MC Dropout, S = 30</text>

  <line x1="1024" y1="120" x2="1048" y2="120" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 6 -->
  <rect x="1050" y="60" width="140" height="120" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="1120" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#134e4a">Calibrated</text>
  <text x="1120" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#134e4a">decisions</text>
  <text x="1120" y="128" text-anchor="middle" font-size="11" fill="#0f766e">conformal intervals</text>
  <text x="1120" y="143" text-anchor="middle" font-size="11" fill="#0f766e">accept / review / reject</text>
</svg>
