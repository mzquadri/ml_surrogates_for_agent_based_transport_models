<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <text x="500" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Conformal prediction: promised vs achieved coverage</text>

  <!-- 90% group -->
  <text x="300" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">90% intervals</text>
  <line x1="140" y1="310" x2="460" y2="310" stroke="#9ca3af"/>
  <rect x="180" y="58" width="70" height="252" rx="3" fill="#9ca3af"/>
  <text x="215" y="50" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">90.00%</text>
  <rect x="290" y="58" width="70" height="252" rx="3" fill="#2563eb"/>
  <text x="325" y="50" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">90.02%</text>
  <text x="215" y="330" text-anchor="middle" font-size="11" fill="#6b7280">promised</text>
  <text x="325" y="330" text-anchor="middle" font-size="11" fill="#6b7280">achieved</text>

  <!-- 95% group -->
  <text x="700" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">95% intervals</text>
  <line x1="540" y1="310" x2="860" y2="310" stroke="#9ca3af"/>
  <rect x="580" y="44" width="70" height="266" rx="3" fill="#9ca3af"/>
  <text x="615" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">95.00%</text>
  <rect x="690" y="44" width="70" height="266" rx="3" fill="#2563eb"/>
  <text x="725" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">95.01%</text>
  <text x="615" y="330" text-anchor="middle" font-size="11" fill="#6b7280">promised</text>
  <text x="725" y="330" text-anchor="middle" font-size="11" fill="#6b7280">achieved</text>

  <text x="500" y="364" text-anchor="middle" font-size="11" fill="#6b7280">Split conformal needs no retraining and keeps its coverage promise. Adaptive conformal tightens worst-case conditional</text>
  <text x="500" y="378" text-anchor="middle" font-size="11" fill="#6b7280">coverage across difficulty deciles from [59.0%, 98.1%] to [83.7%, 96.4%], at PICP90 = 89.87%.</text>
</svg>
