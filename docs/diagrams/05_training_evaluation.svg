<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="980" height="480" fill="#ffffff"/>
  <style>
    .h    { fill:#0f172a; font-size:17px; font-weight:600; }
    .cap  { fill:#64748b; font-size:12.5px; }
    .lbl  { fill:#0f172a; font-size:14px; font-weight:600; }
    .sub  { fill:#64748b; font-size:11.5px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11.5px; fill:#334155; }
    .ar   { stroke:#94a3b8; stroke-width:1.6; fill:none; marker-end:url(#a); }
    .arb  { stroke:#7c3aed; stroke-width:1.6; fill:none; marker-end:url(#p); stroke-dasharray:4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>

  <text class="h" x="34" y="36">Training and evaluation</text>
  <text class="cap" x="34" y="58">Trial 8 configuration, read from its test_evaluation_complete.json.</text>
  <text class="cap" x="34" y="76">Training code is upstream; the trials and the evaluation below are this thesis&#8217;s work.</text>

  <!-- training loop -->
  <rect x="34" y="96" width="912" height="152" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
  <text class="lbl" x="50" y="120">Training loop</text>

  <rect x="50" y="134" width="130" height="58" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="lbl" x="62" y="156">Train split</text>
  <text class="mono" x="62" y="176">800 graphs</text>
  <path class="ar" d="M184,163 L214,163"/>

  <rect x="218" y="134" width="130" height="58" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="lbl" x="230" y="156">Batch</text>
  <text class="mono" x="230" y="176">size 8 &#215; accum 3</text>
  <path class="ar" d="M352,163 L382,163"/>

  <rect x="386" y="134" width="130" height="58" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="lbl" x="398" y="156">Forward pass</text>
  <text class="sub" x="398" y="176">dropout p = 0.2</text>
  <path class="ar" d="M520,163 L550,163"/>

  <rect x="554" y="134" width="130" height="58" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="lbl" x="566" y="156">Loss</text>
  <text class="sub" x="566" y="176">MSE, unweighted</text>
  <path class="ar" d="M688,163 L718,163"/>

  <rect x="722" y="134" width="130" height="58" rx="6" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="lbl" x="734" y="156">Optimiser</text>
  <text class="mono" x="734" y="176">Adam, lr 5e-4</text>

  <path class="arb" d="M852,163 L880,163 L880,214 L120,214 L120,192"/>
  <text class="sub" x="500" y="230">back-propagation, then the next batch</text>

  <!-- validation -->
  <rect x="34" y="266" width="292" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="lbl" x="50" y="290">Validation — 100 graphs</text>
  <text class="sub" x="50" y="312">Early stopping on validation loss.</text>
  <text class="mono" x="50" y="334">R&#178; 0.597   loss 49.27</text>
  <text class="sub" x="50" y="356">val-to-test gap 0.21% — no overfitting</text>

  <path class="ar" d="M330,322 L362,322"/>

  <rect x="366" y="266" width="292" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="lbl" x="382" y="290">Checkpoint</text>
  <text class="mono" x="382" y="312">trained_model/model.pth</text>
  <text class="sub" x="382" y="334">1,416,835 parameters</text>
  <text class="sub" x="382" y="356">16 trials retained under models/</text>

  <path class="ar" d="M662,322 L694,322"/>

  <rect x="698" y="266" width="248" height="112" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text class="lbl" x="714" y="290">Test — 100 graphs</text>
  <text class="mono" x="714" y="312">3,163,500 node predictions</text>
  <text class="mono" x="714" y="334">R&#178; 0.5957  MAE 3.96  RMSE 7.12</text>
  <text class="sub" x="714" y="356">frozen; the UQ layer starts here</text>

  <rect x="34" y="398" width="912" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text class="lbl" x="50" y="422">The surrogate is never retrained after this point</text>
  <text class="sub" x="50" y="442">Everything in the uncertainty pipeline is post-hoc: it reuses this checkpoint and its cached predictions, which is what makes the method cheap to apply.</text>
</svg>
