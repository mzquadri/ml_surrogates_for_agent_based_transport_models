<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <text x="500" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Where the uncertainty signal works, and where it breaks down</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#6b7280">Test links stratified by true speed-change magnitude: calmest quartile (Q1) vs most extreme quartile (Q4)</text>

  <!-- Panel 1: Spearman rho -->
  <text x="270" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Error-uncertainty correlation (Spearman rho)</text>
  <line x1="110" y1="330" x2="430" y2="330" stroke="#9ca3af"/>
  <rect x="150" y="79" width="80" height="251" rx="3" fill="#0d9488"/>
  <text x="190" y="71" text-anchor="middle" font-size="12" font-weight="600" fill="#134e4a">0.721</text>
  <rect x="310" y="295" width="80" height="35" rx="3" fill="#dc2626"/>
  <text x="350" y="287" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">0.100</text>
  <text x="190" y="350" text-anchor="middle" font-size="11" fill="#6b7280">Q1 (calm links)</text>
  <text x="350" y="350" text-anchor="middle" font-size="11" fill="#6b7280">Q4 (extreme changes)</text>

  <!-- Panel 2: MAE -->
  <text x="730" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Mean absolute error (veh/h)</text>
  <line x1="570" y1="330" x2="890" y2="330" stroke="#9ca3af"/>
  <rect x="610" y="299" width="80" height="31" rx="3" fill="#0d9488"/>
  <text x="650" y="291" text-anchor="middle" font-size="12" font-weight="600" fill="#134e4a">1.24</text>
  <rect x="770" y="77" width="80" height="253" rx="3" fill="#dc2626"/>
  <text x="810" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">10.08</text>
  <text x="650" y="350" text-anchor="middle" font-size="11" fill="#6b7280">Q1 (calm links)</text>
  <text x="810" y="350" text-anchor="middle" font-size="11" fill="#6b7280">Q4 (extreme changes)</text>

  <text x="500" y="384" text-anchor="middle" font-size="11" fill="#6b7280">88.7% of test links have zero speed change. The model is reliable there, and unreliable exactly where changes are largest.</text>
</svg>
