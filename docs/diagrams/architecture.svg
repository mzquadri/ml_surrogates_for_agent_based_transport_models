<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="330" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">PointNetTransfGAT architecture</text>

  <!-- Input -->
  <rect x="130" y="60" width="400" height="66" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="330" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Input: one node per road segment</text>
  <text x="330" y="106" text-anchor="middle" font-size="11" fill="#4b5563">traffic and network attributes (flow, capacity, geometry, signals)</text>

  <line x1="330" y1="128" x2="330" y2="150" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- PointNet -->
  <rect x="130" y="152" width="400" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="330" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">PointNet encoder</text>
  <text x="330" y="194" text-anchor="middle" font-size="11" fill="#3b5bdb">shared per-node MLP lifts raw features to an embedding</text>

  <line x1="330" y1="214" x2="330" y2="236" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Transformer -->
  <rect x="130" y="238" width="400" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="330" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Transformer encoder</text>
  <text x="330" y="280" text-anchor="middle" font-size="11" fill="#3b5bdb">self-attention shares global context across all segments</text>

  <line x1="330" y1="300" x2="330" y2="322" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- GAT -->
  <rect x="130" y="324" width="400" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="330" y="348" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Graph attention layers</text>
  <text x="330" y="366" text-anchor="middle" font-size="11" fill="#3b5bdb">attention-weighted aggregation over the road network graph</text>

  <line x1="330" y1="386" x2="330" y2="408" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Head -->
  <rect x="130" y="410" width="400" height="60" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="330" y="434" text-anchor="middle" font-size="13" font-weight="600" fill="#134e4a">Regression head</text>
  <text x="330" y="452" text-anchor="middle" font-size="11" fill="#0f766e">predicted speed change per link</text>

  <!-- MC Dropout side box -->
  <rect x="600" y="200" width="340" height="170" rx="8" fill="#fffbeb" stroke="#d97706" stroke-dasharray="6 4"/>
  <text x="770" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Uncertainty at inference</text>
  <text x="770" y="252" text-anchor="middle" font-size="11" fill="#78350f">Dropout stays active at test time.</text>
  <text x="770" y="272" text-anchor="middle" font-size="11" fill="#78350f">S = 30 stochastic forward passes give</text>
  <text x="770" y="292" text-anchor="middle" font-size="11" fill="#78350f">a predictive mean and a standard</text>
  <text x="770" y="312" text-anchor="middle" font-size="11" fill="#78350f">deviation for every link.</text>
  <text x="770" y="340" text-anchor="middle" font-size="11" font-style="italic" fill="#78350f">Large sigma means the model is unsure.</text>

  <line x1="530" y1="268" x2="598" y2="268" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr2)"/>

  <text x="500" y="520" text-anchor="middle" font-size="11" fill="#6b7280">Trained on 900 scenarios (27.8M segment graphs); evaluated on 100 held-out scenarios (3,163,500 links).</text>
</svg>
