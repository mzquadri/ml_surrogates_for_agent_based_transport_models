<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <text x="500" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Selective prediction: abstaining on uncertain links cuts the error</text>

  <!-- axes -->
  <line x1="90" y1="60" x2="90" y2="340" stroke="#9ca3af"/>
  <line x1="90" y1="340" x2="900" y2="340" stroke="#9ca3af"/>

  <!-- gridlines y: MAE 1,2,3,4 -> y = 340 - v*68.9 -->
  <line x1="90" y1="271" x2="900" y2="271" stroke="#e5e7eb"/>
  <line x1="90" y1="202" x2="900" y2="202" stroke="#e5e7eb"/>
  <line x1="90" y1="133" x2="900" y2="133" stroke="#e5e7eb"/>
  <line x1="90" y1="64" x2="900" y2="64" stroke="#e5e7eb"/>
  <text x="82" y="275" text-anchor="end" font-size="11" fill="#6b7280">1.0</text>
  <text x="82" y="206" text-anchor="end" font-size="11" fill="#6b7280">2.0</text>
  <text x="82" y="137" text-anchor="end" font-size="11" fill="#6b7280">3.0</text>
  <text x="82" y="68" text-anchor="end" font-size="11" fill="#6b7280">4.0</text>
  <text x="40" y="200" font-size="12" fill="#374151" transform="rotate(-90 40 200)" text-anchor="middle">test MAE (veh/h)</text>

  <!-- x labels: retention 10,25,50,100 at x=160,330,540,850 -->
  <text x="160" y="362" text-anchor="middle" font-size="11" fill="#6b7280">10%</text>
  <text x="330" y="362" text-anchor="middle" font-size="11" fill="#6b7280">25%</text>
  <text x="540" y="362" text-anchor="middle" font-size="11" fill="#6b7280">50%</text>
  <text x="850" y="362" text-anchor="middle" font-size="11" fill="#6b7280">100%</text>
  <text x="495" y="392" text-anchor="middle" font-size="12" fill="#374151">share of links kept (most confident first)</text>

  <!-- curve: (160,268) (330,216) (540,180) (850,67) ; y = 340 - MAE*68.9 -->
  <polyline points="160,268 330,216 540,180 850,67" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- points + labels -->
  <circle cx="160" cy="268" r="5" fill="#2563eb"/>
  <text x="160" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">1.05</text>
  <text x="160" y="290" text-anchor="middle" font-size="10" fill="#0f766e">-73.4%</text>

  <circle cx="330" cy="216" r="5" fill="#2563eb"/>
  <text x="330" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">1.80</text>
  <text x="330" y="238" text-anchor="middle" font-size="10" fill="#0f766e">-54.5%</text>

  <circle cx="540" cy="180" r="5" fill="#2563eb"/>
  <text x="540" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">2.32</text>
  <text x="540" y="202" text-anchor="middle" font-size="10" fill="#0f766e">-41.2%</text>

  <circle cx="850" cy="67" r="5" fill="#2563eb"/>
  <text x="850" y="51" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">3.96</text>
  <text x="850" y="89" text-anchor="middle" font-size="10" fill="#6b7280">all links</text>
</svg>
