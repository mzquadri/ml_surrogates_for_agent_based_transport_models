<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1180" height="560" fill="#ffffff"/>
  <style>
    .h { fill:#0f172a; font-size:19px; font-weight:600; }
    .s { fill:#64748b; font-size:12.5px; }
    .lbl { fill:#0f172a; font-size:14px; font-weight:600; }
    .sub { fill:#64748b; font-size:11.5px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11.5px; fill:#334155; }
    .monob { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; fill:#0f172a; font-weight:600; }
    .cap { fill:#64748b; font-size:12px; }
    .tick { fill:#059669; font-size:15px; font-weight:700; }
    .cross { fill:#ea580c; font-size:15px; font-weight:700; }
  </style>
  <text class="h" x="34" y="40">What actually enters the model</text>
  <text class="s" x="34" y="62">Five of the six columns of x are node features. The architecture also consumes connectivity and two coordinate pairs.</text>
  <text class="s" x="34" y="79">Read from the trained Trial 8 checkpoint, not from documentation.</text>
  <rect x="34" y="100" width="470" height="232" rx="9" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.4"/>
  <text class="lbl" x="52" y="128" text-anchor="start">MODEL INPUT   node features from x</text>
  <text class="tick" x="58" y="158" text-anchor="start">&#10003;</text>
  <text class="mono" x="88" y="158" text-anchor="start">x[:, 0]</text>
  <text class="monob" x="160" y="158" text-anchor="start">VOL_BASE_CASE</text>
  <text class="tick" x="58" y="188" text-anchor="start">&#10003;</text>
  <text class="mono" x="88" y="188" text-anchor="start">x[:, 1]</text>
  <text class="monob" x="160" y="188" text-anchor="start">CAPACITY_BASE_CASE</text>
  <text class="tick" x="58" y="218" text-anchor="start">&#10003;</text>
  <text class="mono" x="88" y="218" text-anchor="start">x[:, 2]</text>
  <text class="monob" x="160" y="218" text-anchor="start">CAPACITY_REDUCTION</text>
  <text class="tick" x="58" y="248" text-anchor="start">&#10003;</text>
  <text class="mono" x="88" y="248" text-anchor="start">x[:, 3]</text>
  <text class="monob" x="160" y="248" text-anchor="start">FREESPEED</text>
  <text class="tick" x="58" y="278" text-anchor="start">&#10003;</text>
  <text class="mono" x="88" y="278" text-anchor="start">x[:, 5]</text>
  <text class="monob" x="160" y="278" text-anchor="start">LENGTH</text>
  <text class="mono" x="52" y="318" text-anchor="start">in_channels = 5</text>
  <rect x="534" y="100" width="300" height="232" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.4"/>
  <text class="lbl" x="552" y="128" text-anchor="start">NOT A MODEL FEATURE</text>
  <text class="cross" x="558" y="168" text-anchor="start">&#10007;</text>
  <text class="mono" x="588" y="168" text-anchor="start">x[:, 4]</text>
  <text class="monob" x="660" y="168" text-anchor="start">HIGHWAY</text>
  <text class="sub" x="552" y="202" text-anchor="start">A nominal road class encoded</text>
  <text class="sub" x="552" y="220" text-anchor="start">as an integer. The codes have</text>
  <text class="sub" x="552" y="238" text-anchor="start">no order and no distance, so</text>
  <text class="sub" x="552" y="256" text-anchor="start">arithmetic on them would be</text>
  <text class="sub" x="552" y="274" text-anchor="start">meaningless. See diagram 4.</text>
  <rect x="864" y="100" width="282" height="232" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
  <text class="lbl" x="882" y="128" text-anchor="start">ALSO CONSUMED</text>
  <text class="mono" x="882" y="158" text-anchor="start">pos[:, 0]</text>
  <text class="sub" x="882" y="176" text-anchor="start">start coordinate</text>
  <text class="mono" x="882" y="200" text-anchor="start">pos[:, 1]</text>
  <text class="sub" x="882" y="218" text-anchor="start">end coordinate</text>
  <text class="mono" x="882" y="242" text-anchor="start">edge_index</text>
  <text class="sub" x="882" y="260" text-anchor="start">graph connectivity</text>
  <text class="sub" x="882" y="292" text-anchor="start">pos[:, 2] midpoint is</text>
  <text class="sub" x="882" y="310" text-anchor="start">stored but never read</text>
  <rect x="34" y="360" width="1112" height="132" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text class="lbl" x="52" y="386" text-anchor="start">The evidence</text>
  <text class="sub" x="52" y="410" text-anchor="start">point_net_conv_1.local_nn.0.weight has shape (256, 7). PointNetConv concatenates node features with a 2-D relative</text>
  <text class="sub" x="52" y="430" text-anchor="start">coordinate, so 7 - 2 = 5 feature channels. The forward pass reads data.pos[:, 0] and data.pos[:, 1], and passes</text>
  <text class="sub" x="52" y="450" text-anchor="start">edge_index to all six message-passing layers.</text>
  <text class="sub" x="52" y="476" text-anchor="start">Five of six x columns are node features. It is not true that only five pieces of information enter the model.</text>
  <text class="cap" x="34" y="516">Sources: scripts/training/help_functions.py (the node_features branch), scripts/gnn/models/point_net_transf_gat.py (forward),</text>
  <text class="cap" x="34" y="534">models/point_net_transf_gat_8th_trial_lower_dropout/trained_model/model.pth.</text>
</svg>
