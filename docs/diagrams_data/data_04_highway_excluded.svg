  <text class="mono" x="470" y="461" text-anchor="start">29</text>
  <text class="mono" x="560" y="461" text-anchor="start">0.1%</text>
  <text class="mono" x="650" y="461" text-anchor="start">0</text>
  <text class="mono" x="810" y="461" text-anchor="start">0.00</text>
  <text class="sub" x="970" y="461" text-anchor="start">never</text>
  <rect x="34" y="470" width="1112" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text class="mono" x="52" y="486" text-anchor="start">7</text>
  <text class="sub" x="118" y="486" text-anchor="start">service</text>
  <text class="mono" x="470" y="486" text-anchor="start">471</text>
  <text class="mono" x="560" y="486" text-anchor="start">1.5%</text>
  <text class="mono" x="650" y="486" text-anchor="start">0</text>
  <text class="mono" x="810" y="486" text-anchor="start">0.00</text>
  <text class="sub" x="970" y="486" text-anchor="start">never</text>
  <rect x="34" y="495" width="1112" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text class="mono" x="52" y="511" text-anchor="start">8</text>
  <text class="sub" x="118" y="511" text-anchor="start">construction</text>
  <text class="mono" x="470" y="511" text-anchor="start">8</text>
  <text class="mono" x="560" y="511" text-anchor="start">0.0%</text>
  <text class="mono" x="650" y="511" text-anchor="start">0</text>
  <text class="mono" x="810" y="511" text-anchor="start">0.00</text>
  <text class="sub" x="970" y="511" text-anchor="start">never</text>
  <rect x="34" y="520" width="1112" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text class="mono" x="52" y="536" text-anchor="start">9</text>
  <text class="sub" x="118" y="536" text-anchor="start">unclassified</text>
  <text class="mono" x="470" y="536" text-anchor="start">1,078</text>
  <text class="mono" x="560" y="536" text-anchor="start">3.4%</text>
  <text class="mono" x="650" y="536" text-anchor="start">0</text>
  <text class="mono" x="810" y="536" text-anchor="start">2.26</text>
  <text class="sub" x="970" y="536" text-anchor="start">never</text>
  <text class="cap" x="34" y="598">Only primary, secondary and tertiary are ever intervened. Trunk is never touched by any policy yet carries the second-highest mean response in the</text>
  <text class="cap" x="34" y="616">network, which is spillover rather than treatment. A one-hot encoding or a learned embedding would be a defensible way to use this column; neither</text>
  <text class="cap" x="34" y="634">was part of the thesis, and both belong under future work.</text>
</svg>
