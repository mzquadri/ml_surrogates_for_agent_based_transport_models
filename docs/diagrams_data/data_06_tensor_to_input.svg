<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1180" height="520" fill="#ffffff"/>
  <style>
    .h { fill:#0f172a; font-size:19px; font-weight:600; }
    .s { fill:#64748b; font-size:12.5px; }
    .lbl { fill:#0f172a; font-size:14px; font-weight:600; }
    .sub { fill:#64748b; font-size:11.5px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11.5px; fill:#334155; }
    .monob { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; fill:#0f172a; font-weight:600; }
    .cap { fill:#64748b; font-size:12px; }
    .tick { fill:#059669; font-size:15px; font-weight:700; }
    .cross { fill:#ea580c; font-size:15px; font-weight:700; }
  </style>
  <text class="h" x="34" y="40">From the stored x to the tensor the first layer sees</text>
  <text class="s" x="34" y="62">The column filter is applied at load time, before normalisation statistics are computed.</text>
  <rect x="34" y="110" width="250" height="176" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
  <text class="lbl" x="52" y="138" text-anchor="start">stored x</text>
  <text class="mono" x="52" y="160" text-anchor="start">[31635, 6]</text>
  <text class="mono" x="52" y="186" text-anchor="start">0  VOL_BASE_CASE</text>
  <text class="mono" x="52" y="203" text-anchor="start">1  CAPACITY_BASE_CASE</text>
  <text class="mono" x="52" y="220" text-anchor="start">2  CAPACITY_REDUCTION</text>
  <text class="mono" x="52" y="237" text-anchor="start">3  FREESPEED</text>
  <text class="sub" x="52" y="254" text-anchor="start">4  HIGHWAY</text>
  <text class="mono" x="52" y="271" text-anchor="start">5  LENGTH</text>
  <line x1="290" y1="198" x2="320.0" y2="198" stroke="#94a3b8" stroke-width="1.8"/>
  <polygon points="328,198 320.0,193.4 320.0,202.6" fill="#94a3b8"/>
  <rect x="338" y="110" width="250" height="176" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.4"/>
  <text class="lbl" x="356" y="138" text-anchor="start">column filter</text>
  <text class="mono" x="356" y="160" text-anchor="start">node_feature_filter</text>
  <text class="sub" x="356" y="184" text-anchor="start">HIGHWAY is dropped here.</text>
  <text class="sub" x="356" y="204" text-anchor="start">The five remaining columns</text>
  <text class="sub" x="356" y="224" text-anchor="start">are min-max normalised with</text>
  <text class="sub" x="356" y="244" text-anchor="start">statistics fitted on the</text>
  <text class="sub" x="356" y="264" text-anchor="start">training split only.</text>
  <line x1="594" y1="198" x2="624.0" y2="198" stroke="#94a3b8" stroke-width="1.8"/>
  <polygon points="632,198 624.0,193.4 624.0,202.6" fill="#94a3b8"/>
  <rect x="642" y="110" width="250" height="176" rx="9" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.4"/>
  <text class="lbl" x="660" y="138" text-anchor="start">model input</text>
  <text class="mono" x="660" y="160" text-anchor="start">[31635, 5]</text>
  <text class="sub" x="660" y="186" text-anchor="start">plus pos[:, 0] and pos[:, 1]</text>
  <text class="sub" x="660" y="206" text-anchor="start">plus edge_index</text>
  <text class="sub" x="660" y="236" text-anchor="start">concatenated with a 2-D</text>
  <text class="sub" x="660" y="256" text-anchor="start">relative coordinate inside</text>
  <text class="sub" x="660" y="276" text-anchor="start">PointNetConv</text>
  <line x1="898" y1="198" x2="928.0" y2="198" stroke="#94a3b8" stroke-width="1.8"/>
  <polygon points="936,198 928.0,193.4 928.0,202.6" fill="#94a3b8"/>
  <rect x="946" y="110" width="200" height="176" rx="9" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.4"/>
  <text class="lbl" x="964" y="138" text-anchor="start">first layer</text>
  <text class="mono" x="964" y="164" text-anchor="start">local_nn.0</text>
  <text class="monob" x="964" y="186" text-anchor="start">Linear(7, 256)</text>
  <text class="sub" x="964" y="214" text-anchor="start">7 = 5 features</text>
  <text class="sub" x="964" y="234" text-anchor="start">    + 2 coordinates</text>
  <text class="sub" x="964" y="266" text-anchor="start">verified in the</text>
  <text class="sub" x="964" y="284" text-anchor="start">checkpoint</text>
  <text class="cap" x="34" y="476">The 5-column filter is the use_all_features = False branch in scripts/training/help_functions.py. The alternative branch would have kept</text>
  <text class="cap" x="34" y="494">HIGHWAY and NET_FLOW, giving seven names for a six-column tensor; the trained checkpoint shows the five-feature branch is the one that ran.</text>
</svg>
