name: Repository Check

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            dashboard-requirements.txt
            requirements-dev.txt
      - run: pip install -r dashboard-requirements.txt -r requirements-dev.txt
      - run: python scripts/check_repository.py
      - run: ruff check thesis_dashboard scripts tests
      - run: pyright
      - run: python -m pytest -p no:cacheprovider tests
