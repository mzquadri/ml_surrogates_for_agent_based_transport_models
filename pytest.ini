[pytest]
# Collect only the test suite.
#
# Without this, pytest walks the whole repository and picks up anything whose filename
# matches its patterns. Two archived scripts do -- run_ensemble_quick_test.py and
# eda_7_train_vs_test.py -- and both fail at import: one wants a module layout that no
# longer exists, the other opens a file relative to the directory it was originally run
# from. Neither is a test. They arrived with the consolidation on 1 Sep 2026 and are kept
# for provenance, not to be executed.
#
# The failure that caused was three collection errors reported before any real test ran,
# which is the kind of noise that trains people to ignore a red suite.
testpaths = tests
